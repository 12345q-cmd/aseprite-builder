name   名字: Build and release Aseprite

on:   :
  push:   推动:
    branches:   分支:
      - main   ——主要
    paths:   道路:
      - 'BuildLog.md'
  workflow_dispatch:
env:
  BUILD_TYPE: Release   BUILD_TYPE:释放

jobs:   工作:
  fetch-aseprite-info:   获取 Aseprite 信息：
    name: Fetch deps info   名称：获取依赖项信息
    runs-on: ubuntu-latest   运行于：ubuntu-latest
    outputs:   输出:
      download-link: ${{ steps.aseprite-link.outputs.download-link }}下载链接：${{ steps.aseprite-link.outputs.download-link }}
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}发布标签：${{ 步骤.aseprite-link.输出.发布标签 }}
    steps:   步骤:
      - name: Fetch Aseprite release link- 名称：获取 Aseprite 发布链接
        id: aseprite-link
        uses: a1393323447/fetch-release@main使用：a1393323447/fetch-release@main
        with:   :
            group: aseprite   aseprite group):
            repo: aseprite   回购:aseprite
            match: Aseprite-.*?-Source.zip匹配：Aseprite-.*?-Source.zip

  create-release:   创建发布:
    name: Create Release   名称：创建发布
    runs-on: ubuntu-latest   运行于：ubuntu-latest
    needs: fetch-aseprite-info需求：获取 Aseprite 信息
    permissions:
      contents: write
    outputs:
      download-link: ${{ needs.fetch-aseprite-info.outputs.download-link }}下载链接：${{ needs.fetch-aseprite-info.outputs.download-link }}
      release-tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}发布标签：${{ needs.fetch-aseprite-info.outputs.release-tag }}
    steps:   步骤:
      - uses: actions/checkout@v2- 使用：actions/checkout@v2
      - uses: ncipollo/release-action@v1
        with:   :
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite   名称：构建Aseprite
    needs: create-release   需求：创建-发布
    permissions:   权限:
      contents: write   内容:写
    runs-on: ${{ matrix.os }}   运行于：${{ matrix.os }}
    strategy:   策略:
        matrix:
          os: [ windows-latest, ubuntu-latest, macOS-latest ]操作系统：[ Windows 最新版本，Ubuntu 最新版本，macOS 最新版本 ]
        fail-fast: false
    steps:   步骤:
      - name: Install Dependencies
        if: runner.os == 'Linux'
        shell: bash
        run   运行: |
          sudo apt-get update -qq   以静默模式更新软件包列表：`sudo apt-get update -qq`
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev
      - - 使用：actions/checkout@v4uses: actions/checkout@v4
      - - name: Install Asepritename   名字: Install Aseprite
        shell   bash shell:   壳牌: bash
        run   运行: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.create-release.outputs.release-tag }}```bash
git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.create-release.outputs.release-tag }}
